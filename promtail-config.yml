server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["app-1", "app-2", "app-3"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: '/(.*)'
        replacement: '$1'
    pipeline_stages:
      - json:
          expressions:
            log: log
      - output:
          source: log
      - json:
          expressions:
            level: level
            serverId: serverId
      - labels:
          level:
          serverId:
